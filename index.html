<!-- ───────────────────────── Boot splash ───────────────────────── -->
<div id="boot" role="status" aria-label="Loading Eaty">
  <div class="boot-mark"><svg viewBox="0 0 24 24" width="40" height="40"><use href="#i-leaf"/></svg></div>
  <div class="boot-name">Eaty</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- ───────────────────────── App bar ───────────────────────── -->
<header id="appbar">
  <div class="appbar-inner">
    <button class="appbar-btn" id="appbar-left" type="button" hidden></button>
    <div class="appbar-title">
      <h1 id="appbar-title">Today</h1>
      <p id="appbar-sub"></p>
    </div>
    <div class="appbar-actions" id="appbar-actions"></div>
  </div>
</header>

<!-- ───────────────────────── Views ───────────────────────── -->
<main id="views">
  <section class="view" id="view-today"  data-view="today"   aria-label="Today"></section>
  <section class="view" id="view-diary"  data-view="diary"   aria-label="Diary" hidden></section>
  <section class="view" id="view-recipes"data-view="recipes" aria-label="Recipes" hidden></section>
  <section class="view" id="view-plan"   data-view="plan"    aria-label="Meal plan" hidden></section>
  <section class="view" id="view-trends" data-view="trends"  aria-label="Trends" hidden></section>
</main>

<!-- ───────────────────────── Quick add ───────────────────────── -->
<button id="fab-scan" type="button" aria-label="Scan a barcode">
  <svg viewBox="0 0 24 24"><use href="#i-barcode"/></svg>
</button>
<button id="fab" type="button" aria-label="Add food">
  <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>
</button>

<!-- ───────────────────────── Bottom navigation ───────────────────────── -->
<nav id="tabbar" aria-label="Main">
  <button class="tab is-active" data-tab="today" type="button">
    <svg viewBox="0 0 24 24"><use href="#i-home"/></svg><span>Today</span>
  </button>
  <button class="tab" data-tab="diary" type="button">
    <svg viewBox="0 0 24 24"><use href="#i-diary"/></svg><span>Diary</span>
  </button>
  <button class="tab" data-tab="recipes" type="button">
    <svg viewBox="0 0 24 24"><use href="#i-recipes"/></svg><span>Recipes</span>
  </button>
  <button class="tab" data-tab="plan" type="button">
    <svg viewBox="0 0 24 24"><use href="#i-plan"/></svg><span>Plan</span>
  </button>
  <button class="tab" data-tab="trends" type="button">
    <svg viewBox="0 0 24 24"><use href="#i-trends"/></svg><span>Trends</span>
  </button>
</nav>

<!-- ───────────────────────── Overlays ───────────────────────── -->
<div id="sheet-host" aria-live="polite"></div>
<div id="toast-host" aria-live="polite" aria-atomic="true"></div>
<div id="onboard-host"></div>

<noscript>
  <div style="padding:24px;font:16px system-ui;color:#fff;background:#0A0E17">
    Eaty needs JavaScript enabled.
  </div>
</noscript>

<script src="js/offapi.js"></script>
<script src="js/fdcapi.js"></script>
<script src="js/localpack.js"></script>
<script src="js/foodsheet.js"></script>
<script src="js/scanner.js"></script>
<script src="js/supplements.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/diary.js"></script>
<script src="js/views/recipes.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/trends.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/onboarding.js"></script>
<script src="app.js"></script>
</body>
</html>
